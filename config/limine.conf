timeout: 3
serial: yes

/T2XNU (ARM64 + xnulinux — Interactive Shell)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=tty0 console=ttyAMA0,115200
    module_path: boot():/boot/initramfs.cpio.zst

/T2XNU (Serial Console — QEMU aarch64)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyAMA0,115200
    module_path: boot():/boot/initramfs.cpio.zst

/T2XNU (CI Self-Test)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyAMA0,115200 quiet t2.selftest=1
    module_path: boot():/boot/initramfs.cpio.zst
