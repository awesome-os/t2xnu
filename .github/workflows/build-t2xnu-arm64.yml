name: Build and Boot T2XNU (ARM64)

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-boot-aarch64:
    name: Build & Boot T2XNU (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build, ISO, disk, and QEMU ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-arm qemu-utils qemu-efi-aarch64 xorriso mtools dosfstools \
            e2fsprogs parted zstd busybox-static musl-tools ca-certificates \
            jq curl cpio

      - name: Compile static musl ARM64 PID 1 (/init)
        run: |
          mkdir -p dist build
          musl-gcc -static -Os -s -Wall -Wextra src/init.c -o dist/init-aarch64
          file dist/init-aarch64
          ls -lh dist/init-aarch64

      - name: Fetch b8g-ghost ARM64 from awesome-os/b8g-ghost @ cas-v1
        run: |
          curl -fsSL https://raw.githubusercontent.com/awesome-os/b8g-ghost/main/manifests/index.json -o build/cas-index.json
          GHOST_KEY="b8g-ghost-linux-arm64"
          GHOST_URL=$(jq -r --arg k "$GHOST_KEY" '.entries[$k].download_url // empty' build/cas-index.json)
          GHOST_SHA=$(jq -r --arg k "$GHOST_KEY" '.entries[$k].sha256 // empty' build/cas-index.json)

          if [ -z "$GHOST_URL" ]; then
            GHOST_KEY="b8g-shim-linux-arm64"
            GHOST_URL=$(jq -r --arg k "$GHOST_KEY" '.entries[$k].download_url // empty' build/cas-index.json)
            GHOST_SHA=$(jq -r --arg k "$GHOST_KEY" '.entries[$k].sha256 // empty' build/cas-index.json)
          fi

          test -n "$GHOST_URL"
          echo "Fetched CAS manifest key: $GHOST_KEY ($GHOST_SHA)"
          curl -fsSL "$GHOST_URL" -o build/cas-ghost-bin
          echo "$GHOST_SHA  build/cas-ghost-bin" | sha256sum -c -
          chmod +x build/cas-ghost-bin
          file build/cas-ghost-bin

      - name: Build initramfs-aarch64.cpio.zst
        run: |
          ROOTFS="$PWD/build/rootfs"
          rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"/{bin,sbin,scripts,proc,sys,dev,tmp,run,root,var/lib/b8g/cas,etc/ssl/certs}

          cp dist/init-aarch64 "$ROOTFS/init"
          chmod 755 "$ROOTFS/init"

          cp /bin/busybox "$ROOTFS/bin/busybox"
          chmod 755 "$ROOTFS/bin/busybox"
          for cmd in sh mount umount uname ip udhcpc ls cat poweroff reboot wget sha256sum mkdir cp mv rm grep sed awk tar zcat echo sleep ps dmesg clear env id hostname insmod lsmod modprobe; do
            ln -sf busybox "$ROOTFS/bin/$cmd"
          done

          if file build/cas-ghost-bin | grep -qi "statically linked"; then
            cp build/cas-ghost-bin "$ROOTFS/bin/b8g-ghost"
            chmod 755 "$ROOTFS/bin/b8g-ghost"
          else
            cp build/cas-ghost-bin "$ROOTFS/bin/b8g-shim"
            chmod 755 "$ROOTFS/bin/b8g-shim"
            cat << 'EOF' > "$ROOTFS/bin/b8g-ghost"
          #!/bin/sh
          set -e
          INDEX_URL="https://raw.githubusercontent.com/awesome-os/b8g-ghost/main/manifests/index.json"
          CAS_DIR="${B8G_CAS_DIR:-/var/lib/b8g/cas}"
          case "${1:-}" in
            --version|-v)
              echo "b8g-ghost 0.1.0 (t2xnu aarch64 cas-v1 hydrator, B8G_ABI_MAGIC_V3=0x33564742)"
              exit 0
              ;;
            --help|-h|"")
              echo "Usage: b8g-ghost [--version | index | fetch <sha256>]"
              echo "  CAS store: $CAS_DIR"
              echo "  Index URL: $INDEX_URL"
              exit 0
              ;;
            index)
              mkdir -p "$CAS_DIR"
              wget -q -O "$CAS_DIR/index.json" "$INDEX_URL"
              echo "Saved $CAS_DIR/index.json"
              ;;
            fetch)
              mkdir -p "$CAS_DIR/blobs"
              wget -q -O "$CAS_DIR/blobs/$2" "https://github.com/awesome-os/b8g-ghost/releases/download/cas-v1/$2"
              echo "$2  $CAS_DIR/blobs/$2" | sha256sum -c -
              ;;
            *)
              echo "Unknown command: $1" >&2
              exit 1
              ;;
          esac
          EOF
            chmod 755 "$ROOTFS/bin/b8g-ghost"
          fi

          cp scripts/enable-xnulinux.sh "$ROOTFS/scripts/enable-xnulinux.sh"
          chmod 755 "$ROOTFS/scripts/enable-xnulinux.sh"

          cp /etc/ssl/certs/ca-certificates.crt "$ROOTFS/etc/ssl/certs/ca-certificates.crt"
          cat << 'EOF' > "$ROOTFS/etc/t2xnu-release"
          NAME="T2XNU"
          VERSION="0.1.0"
          ID=t2xnu
          ARCH=aarch64
          PRETTY_NAME="T2XNU 0.1.0 (ARM64 Linux + xnulinux + b8g-ghost CAS)"
          B8G_ABI_MAGIC_V3=0x33564742
          EOF

          (cd "$ROOTFS" && find . -print0 | cpio --null -ov --format=newc | zstd -19 -T0) > dist/initramfs-aarch64.cpio.zst
          ls -lh dist/initramfs-aarch64.cpio.zst

      - name: Stage bootable Linux ARM64 kernel
        run: |
          KPATH="/boot/vmlinuz-$(uname -r)"
          if [ ! -f "$KPATH" ]; then
            KPATH=$(ls -1 /boot/vmlinuz-* | sort -V | tail -n 1)
          fi
          echo "Using kernel: $KPATH"
          sudo cp "$KPATH" dist/vmlinuz-aarch64
          sudo chmod 644 dist/vmlinuz-aarch64
          file dist/vmlinuz-aarch64
          ls -lh dist/vmlinuz-aarch64

      - name: Fetch Limine v8 and build UEFI ARM64 ISO
        run: |
          git clone --depth=1 --branch=v8.x-binary https://github.com/limine-bootloader/limine.git build/limine
          ls -lh build/limine/BOOTAA64.EFI

          mkdir -p build/iso_root/boot/limine build/iso_root/EFI/BOOT
          cp dist/vmlinuz-aarch64 build/iso_root/boot/vmlinuz
          cp dist/initramfs-aarch64.cpio.zst build/iso_root/boot/initramfs.cpio.zst
          cp config/limine.conf build/iso_root/boot/limine/limine.conf
          cp build/limine/BOOTAA64.EFI build/iso_root/EFI/BOOT/BOOTAA64.EFI

          # Build dedicated El Torito / GPT EFI System Partition image for ARM64 UEFI boot
          truncate -s 4M build/iso_root/boot/efiboot.img
          mkfs.fat -n T2XNU_EFI build/iso_root/boot/efiboot.img
          mmd -i build/iso_root/boot/efiboot.img ::/EFI ::/EFI/BOOT
          mcopy -i build/iso_root/boot/efiboot.img build/limine/BOOTAA64.EFI ::/EFI/BOOT/BOOTAA64.EFI

          xorriso -as mkisofs \
            -R -r -J \
            -V "T2XNU_ARM64" \
            -e boot/efiboot.img \
            -no-emul-boot \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            build/iso_root -o dist/t2xnu-aarch64.iso

          ls -lh dist/t2xnu-aarch64.iso

      - name: Build GPT UEFI + ext4 B8G_CAS QCOW2 image (ARM64)
        run: |
          # 128 MiB raw GPT disk:
          #   p1: 1 MiB .. 65 MiB (64 MiB FAT32 EFI System Partition)
          #   p2: 65 MiB .. 127 MiB (62 MiB ext4 LABEL=B8G_CAS)
          truncate -s 128M build/t2xnu-aarch64.img
          parted -s build/t2xnu-aarch64.img mklabel gpt
          parted -s build/t2xnu-aarch64.img mkpart ESP fat32 1MiB 65MiB
          parted -s build/t2xnu-aarch64.img set 1 esp on
          parted -s build/t2xnu-aarch64.img mkpart B8G_CAS ext4 65MiB 127MiB

          truncate -s 64M build/esp.img
          mkfs.fat -F 32 -n T2XNU build/esp.img
          mmd -i build/esp.img ::/EFI ::/EFI/BOOT ::/boot ::/boot/limine
          mcopy -i build/esp.img build/limine/BOOTAA64.EFI ::/EFI/BOOT/BOOTAA64.EFI
          mcopy -i build/esp.img config/limine.conf ::/boot/limine/limine.conf
          mcopy -i build/esp.img dist/vmlinuz-aarch64 ::/boot/vmlinuz
          mcopy -i build/esp.img dist/initramfs-aarch64.cpio.zst ::/boot/initramfs.cpio.zst

          truncate -s 62M build/cas.img
          mkfs.ext4 -q -L B8G_CAS -F build/cas.img

          dd if=build/esp.img of=build/t2xnu-aarch64.img bs=1M seek=1 conv=notrunc status=none
          dd if=build/cas.img of=build/t2xnu-aarch64.img bs=1M seek=65 conv=notrunc status=none

          qemu-img convert -f raw -O qcow2 -c build/t2xnu-aarch64.img dist/t2xnu-aarch64.qcow2
          qemu-img info dist/t2xnu-aarch64.qcow2
          ls -lh dist/t2xnu-aarch64.qcow2

      - name: Live ARM64 QEMU Boot Verification (Direct Kernel + Initramfs Self-Test)
        run: |
          set -o pipefail
          timeout 60s qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 \
            -nographic -no-reboot \
            -kernel dist/vmlinuz-aarch64 \
            -initrd dist/initramfs-aarch64.cpio.zst \
            -append "console=ttyAMA0,115200 t2.selftest=1" | tee build/qemu-arm64.log

          grep -F '[T2XNU] PID 1 READY (B8G_ABI_MAGIC_V3=0x33564742 | arch=aarch64 | xnulinux-ready)' build/qemu-arm64.log
          grep -F '[T2XNU] SELFTEST PASS' build/qemu-arm64.log

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t2xnu-aarch64
          path: |
            dist/t2xnu-aarch64.iso
            dist/t2xnu-aarch64.qcow2
            dist/vmlinuz-aarch64
            dist/initramfs-aarch64.cpio.zst
            dist/init-aarch64

      - name: Create or update v0.1.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum t2xnu-aarch64.iso t2xnu-aarch64.qcow2 vmlinuz-aarch64 initramfs-aarch64.cpio.zst init-aarch64 > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 \
              dist/t2xnu-aarch64.iso \
              dist/t2xnu-aarch64.qcow2 \
              dist/vmlinuz-aarch64 \
              dist/initramfs-aarch64.cpio.zst \
              dist/init-aarch64 \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create v0.1.0 \
              dist/t2xnu-aarch64.iso \
              dist/t2xnu-aarch64.qcow2 \
              dist/vmlinuz-aarch64 \
              dist/initramfs-aarch64.cpio.zst \
              dist/init-aarch64 \
              dist/SHA256SUMS.txt \
              --title "T2XNU v0.1.0 — ARM64 UEFI ISO & QEMU QCOW2 (xnulinux-ready)" \
              --notes "Sovereign ARM64 bootable UEFI ISO and QEMU QCOW2 powered by Awesome-OS b8g-ghost CAS (B8G_ABI_MAGIC_V3=0x33564742) with bundled xnulinux loader (/scripts/enable-xnulinux.sh). Verified with live ARM64 QEMU direct-kernel self-test."
          fi
