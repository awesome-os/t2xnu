name: T2XNU CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/t2xnu.test.mts
      - run: node src/index.mts --status
      - run: sh -n scripts/enable-xnulinux.sh
